name: Skill Robustness Test

on:
  push:
    paths:
      - '.hxsk/tests/scenarios/**'
      - '.hxsk/scripts/run-skill-test.sh'
      - '.claude/skills/**'
  pull_request:
    paths:
      - '.hxsk/tests/scenarios/**'
      - '.hxsk/scripts/run-skill-test.sh'
      - '.claude/skills/**'
  workflow_dispatch:

jobs:
  dry-run:
    name: Scenario Structure Validation (Dry Run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate scenario structure
        run: bash .hxsk/scripts/run-skill-test.sh --all

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skill-test-reports
          path: .hxsk/reports/skill-test-*.md
          if-no-files-found: ignore
