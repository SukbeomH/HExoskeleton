name: PR Consistency Check

on:
  pull_request:
    branches: [master]

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run local verification bundle
        run: bash .hxsk/scripts/local-verify.sh
        env:
          HXSK_SKIP_GITHUB: "1"
