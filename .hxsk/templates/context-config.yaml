# Context Management Configuration
# Controls automatic cleanup and archiving of .hxsk files

# Active layer limits (files read every session)
active:
  patterns:
    max_items: 20
    max_kb: 2
    auto_prune: true  # Remove oldest when limit exceeded
  current:
    max_kb: 1
    reset_on_session_start: true
  prd_active:
    max_kb: 3

# Archive layer settings (files not read routinely)
archive:
  journal:
    keep_sessions: 5
    archive_older: true
    archive_format: "journal-{year}-{month}.md"
  changelog:
    keep_entries: 20
    archive_monthly: true
    archive_format: "changelog-{year}-{month}.md"
  prd_done:
    retention_days: 30
    archive_format: "prd-{year}-{month}.json"

# Memory retention policy (.hxsk/memories/)
# 정책: local-tier(gitignored)만 자동 정리. cap 기반 FIFO + TTL 보조.
# 가치 태그(decision, root-cause, incident, security, pattern, lesson)는
# 삭제 직전 shared-tier로 자동 승격되어 git으로 보존됨.
memory:
  session-summary:
    max_files: 20           # 최신 20개만 유지 (FIFO, cap 기반)
    ttl_days: 7             # 보조 TTL (stop hook 외부 수동 실행 시)
  session-snapshot:
    max_files: 10           # 최신 10개 유지 (임시 스냅샷)
    ttl_days: 7
  # shared-tier (git 관리, 자동 정리 제외):
  #   architecture-decision, root-cause, pattern-discovery, security-finding,
  #   lessons-learned, execution-summary

# Folder organization
folders:
  reports: reports/      # REPORT-*.md auto-moved here
  research: research/    # RESEARCH-*.md auto-moved here
  archive: archive/      # Monthly archives

# Auto-cleanup triggers
triggers:
  on_session_end: true
  on_compact: true
  manual_only: false
